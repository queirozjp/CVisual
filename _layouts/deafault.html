<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computação Visual</title>
    <style>
        :root {
            --bg: #050816;
            --panel: rgba(10, 17, 38, 0.88);
            --panel-strong: #0b1228;
            --cyan: #62f4ff;
            --blue: #5f7cff;
            --violet: #9b6cff;
            --green: #66ffb3;
            --text: #e8f0ff;
            --muted: #8ea4c9;
            --line: rgba(98, 244, 255, 0.22);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px 20px;
            color: var(--text);
            font-family: "Cascadia Code", "Fira Code", Consolas, "Courier New", monospace;
            background:
                linear-gradient(rgba(98, 244, 255, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(98, 244, 255, 0.045) 1px, transparent 1px),
                radial-gradient(circle at 12% 10%, rgba(95, 124, 255, 0.20), transparent 30%),
                radial-gradient(circle at 85% 15%, rgba(155, 108, 255, 0.14), transparent 28%),
                #050816;
            background-size: 34px 34px, 34px 34px, auto, auto, auto;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(255,255,255,0.015) 49%,
                rgba(98,244,255,0.03) 50%,
                transparent 51%
            );
            background-size: 100% 6px;
            opacity: .45;
            z-index: 50;
        }

        ::selection {
            background: var(--cyan);
            color: #041019;
        }

        .wrapper {
            width: min(1180px, 100%);
            margin: 0 auto;
        }

        .header-banner {
            position: relative;
            min-height: 220px;
            margin-bottom: 22px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 24px;
            background:
                radial-gradient(circle at 70% 35%, rgba(98, 244, 255, .16), transparent 18%),
                radial-gradient(circle at 78% 58%, rgba(155, 108, 255, .18), transparent 24%),
                linear-gradient(135deg, rgba(95,124,255,.14), transparent 42%),
                var(--panel-strong);
            box-shadow: var(--shadow), inset 0 0 45px rgba(98, 244, 255, 0.035);
        }

        .header-banner::before {
            content: "COMPUTAÇÃO VISUAL";
            position: absolute;
            left: clamp(24px, 5vw, 64px);
            top: 50%;
            transform: translateY(-58%);
            font-size: clamp(34px, 6vw, 72px);
            line-height: .95;
            font-weight: 900;
            letter-spacing: -0.06em;
            color: transparent;
            -webkit-text-stroke: 1px rgba(232, 240, 255, .92);
            text-shadow: 0 0 30px rgba(98, 244, 255, .22);
        }

        .header-banner::after {
            content: "RGB  •  RASTER  •  VECTOR  •  PIXEL  •  RENDER";
            position: absolute;
            left: clamp(26px, 5vw, 66px);
            bottom: 28px;
            color: var(--cyan);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .16em;
            white-space: nowrap;
        }

        .layout {
            display: grid;
            grid-template-columns: 230px minmax(0, 1fr) 270px;
            gap: 20px;
            align-items: start;
        }

        .sidebar-left,
        .main-content,
        .sidebar-right {
            position: relative;
            border: 1px solid var(--line);
            border-radius: 18px;
            overflow: hidden;
            background: var(--panel);
            box-shadow: 0 14px 40px rgba(0, 0, 0, .25);
            backdrop-filter: blur(10px);
        }

        .sidebar-left::before {
            content: "</>";
            display: grid;
            place-items: center;
            width: 104px;
            height: 104px;
            margin: 28px auto 20px;
            border: 1px solid rgba(98, 244, 255, .4);
            border-radius: 28px;
            color: var(--cyan);
            font-size: 34px;
            font-weight: 900;
            background:
                linear-gradient(135deg, rgba(98,244,255,.08), rgba(155,108,255,.09));
            box-shadow:
                0 0 0 8px rgba(98, 244, 255, .025),
                0 0 28px rgba(98, 244, 255, .10);
            transform: rotate(-3deg);
        }

        .profile-pic,
        .tenor-gif-embed,
        .sidebar-left script {
            display: none !important;
        }

        .main-content {
            min-height: 540px;
        }

        .sidebar-right {
            min-height: 280px;
        }

        .title-bar {
            position: relative;
            margin: 0;
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
            background: linear-gradient(90deg, rgba(98, 244, 255, .08), rgba(95,124,255,.06));
            color: var(--text);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .10em;
            text-align: left;
            text-transform: uppercase;
        }

        .title-bar::before {
            content: "●";
            margin-right: 10px;
            color: var(--green);
            text-shadow: 0 0 9px currentColor;
        }

        .profile-info {
            padding: 18px 20px 24px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .profile-info::before {
            content: "USER_PROFILE.EXE";
            display: block;
            margin-bottom: 12px;
            color: var(--cyan);
            font-size: 10px;
            letter-spacing: .16em;
        }

        .main-content > div:last-child {
            position: relative;
            padding: 30px !important;
            line-height: 1.75 !important;
            color: #dbe7ff;
        }

        .main-content > div:last-child::before {
            content: "01  02  03  04  05";
            display: block;
            margin-bottom: 22px;
            padding-bottom: 12px;
            border-bottom: 1px dashed rgba(98,244,255,.18);
            color: rgba(98,244,255,.58);
            font-size: 10px;
            letter-spacing: .25em;
        }

        .main-content a,
        .retro-list a {
            color: var(--cyan);
            text-decoration: none;
        }

        .main-content a:hover,
        .retro-list a:hover {
            color: white;
            text-shadow: 0 0 10px rgba(98, 244, 255, .75);
        }

        .retro-list {
            margin: 0;
            padding: 22px 22px 22px 40px;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            list-style-type: square;
        }

        .retro-list li {
            margin-bottom: 12px;
        }

        .retro-list li::marker {
            color: var(--cyan);
        }

        .retro-list span {
            color: var(--muted);
            font-weight: 400;
        }

        .activities-list {
            list-style: none;
            margin: 0;
            padding: 14px;
        }

        .activities-list li {
            display: grid;
            grid-template-columns: 42px 1fr;
            align-items: center;
            gap: 11px;
            margin: 0;
            padding: 11px 4px;
            border-bottom: 1px solid rgba(98, 244, 255, .09);
            color: var(--muted);
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.45;
        }

        .activities-list li:last-child {
            border-bottom: 0;
        }

        .activities-list a {
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border: 1px solid rgba(98, 244, 255, .32);
            border-radius: 11px;
            color: var(--cyan);
            background: rgba(98, 244, 255, .055);
            box-shadow: inset 0 0 18px rgba(98, 244, 255, .025);
            font-size: 13px;
            font-weight: 900;
            text-decoration: none;
            transition: transform .18s ease, background .18s ease, color .18s ease, box-shadow .18s ease;
        }

        .activities-list a:hover {
            transform: translateY(-2px);
            color: #06101d;
            background: var(--cyan);
            box-shadow: 0 0 22px rgba(98, 244, 255, .25);
        }

        @media (max-width: 980px) {
            .layout {
                grid-template-columns: 210px minmax(0, 1fr);
            }

            .sidebar-right {
                grid-column: 1 / -1;
            }

            .activities-list {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 4px 18px;
            }
        }

        @media (max-width: 680px) {
            body {
                padding: 16px 12px 28px;
            }

            .header-banner {
                min-height: 190px;
                border-radius: 18px;
            }

            .header-banner::before {
                left: 22px;
                right: 22px;
                font-size: clamp(36px, 13vw, 58px);
            }

            .header-banner::after {
                left: 24px;
                max-width: calc(100% - 48px);
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .layout {
                grid-template-columns: 1fr;
            }

            .sidebar-right {
                grid-column: auto;
            }

            .activities-list {
                display: block;
            }

            .sidebar-left::before {
                width: 88px;
                height: 88px;
                margin-top: 22px;
                font-size: 28px;
            }

            .main-content > div:last-child {
                padding: 22px !important;
            }
        }
    </style>
</head>

    </div>
    
</div>

</body>
</html>
